[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profuse-st"
version = "0.1.0"
description = "Prototype-enhanced fusion for histology-based spatial gene expression prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "h5py>=3.8", "PyYAML>=6"]

[project.scripts]
profuse-train = "profuse_st.train:main"
profuse-predict = "profuse_st.predict:main"
profuse-split = "profuse_st.splits:main"

[tool.setuptools.packages.find]
include = ["profuse_st*"]
